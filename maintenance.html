<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Under Maintenance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand:#e63946; --ink:#1d3557; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1d3557 0%, #2a4a73 60%, #e63946 160%);
      color: #fff;
      padding: 24px;
    }
    .card-wrap {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 48px 36px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 18px;
      display: inline-block;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-weight: 700; font-size: 1.9rem; margin: 0 0 12px; }
    p { font-weight: 300; font-size: 1.02rem; opacity: 0.92; margin: 0 auto 8px; max-width: 400px; }
    .divider { height: 1px; background: rgba(255,255,255,0.16); margin: 26px 0 18px; }
    .foot { font-size: 0.82rem; opacity: 0.75; }
    .btn-retry {
      margin-top: 22px;
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 10px 26px;
    }
    .btn-retry:hover { background: #f1f1f1; color: var(--ink); }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="icon"><i class="bi bi-gear-fill"></i></div>
    <h1>We&rsquo;ll be right back</h1>
    <p>Our system is currently undergoing scheduled maintenance to bring you a better experience.</p>
    <p>Please check back in a few minutes. Thank you for your patience.</p>
    <button class="btn btn-retry" onclick="location.reload()">
      <i class="bi bi-arrow-clockwise"></i> Retry now
    </button>
    <div class="divider"></div>
    <div class="foot">Powered by AK Computer, Dwarka</div>
  </div>
</body>
</html>
